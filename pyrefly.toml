# pyrefly config for a PyTorch research project.
# Options are top-level in pyrefly.toml (a [tool.pyrefly] table is
# only valid inside pyproject.toml).

project-includes = ["**/*.py"]

project-excludes = [
    "**/build/**",
    "**/dist/**",
    "**/*.egg-info/**",
    "**/__pycache__/**",
    "**/.mypy_cache/**",
    "**/.pyrefly/**",
    "**/.venv/**",
    "**/venv/**",
    "**/env/**",
    "**/data/**",
    "**/checkpoints/**",
    "**/*.pt",
    "**/*.pth",
    "**/*.safetensors",
    "**/*.bin",
]

python-version = "3.11"

# The repo root is on sys.path so `tests.test_blocks_shapes`
# resolves (pytest imports it that way via rootdir conftest).
search-path = ["."]

# Strict: check unannotated defs, infer their return types.
check-unannotated-defs = true
untyped-def-behavior = "check-and-infer-return-type"
use-ignore-files = true
permissive-ignores = true
