fail_fast: true

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        args: [--fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]
  - repo: https://github.com/mwouts/jupytext
    rev: v1.19.6
    hooks:
      - id: jupytext
        args: [--sync, --pre-commit]
        pass_filenames: false
  # Only when the type baseline is zero; a failing baseline blocks every
  # commit, so omit this hook until `pyrefly check` passes clean.
  - repo: https://github.com/facebook/pyrefly-pre-commit
    rev: v1.3.2
    hooks:
      - id: pyrefly-check
        language: system
        # Locked version, not system pyrefly: checks run against uv.lock.
        entry: uv run --no-sync pyrefly check
        pass_filenames: false
        always_run: true
  - repo: https://github.com/christophmeissner/pytest-pre-commit
    rev: v1.0.0
    hooks:
      - id: pytest
        name: pytest suite
        # Project env (plugins + package installed) via uv.
        entry: uv run --no-sync pytest -q
        language: system
        pass_filenames: false
        always_run: true
  - repo: https://github.com/scanaislop/aislop
    rev: v0.18.1
    hooks:
      - id: aislop

