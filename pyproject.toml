[project]
name = "MemoryMachines"
version = "0.1.0"
description = "Research project combining my previous experiments into a cheap LLM"
requires-python = ">=3.11"
dependencies = [
    "einops>=0.8.2",
    "huggingface-hub>=2.2.0,<3",
    "hydra-core>=1.3.7",
    "numpy>=2.4.6",
    "omegaconf>=2.3.1",
    "pytorch-lightning>=2.6.6",
    "safetensors>=0.8.0",
    "taichi>=1.7.4",
    "torch>=2.14.1",
    "torchaudio>=2.11.0",
    "torchvision>=0.29.1",
    "tqdm>=4.70.1",
    "transformers>=5.19.0",
]
readme = "README.md"
license = "MIT"
keywords = ["pytorch", "deep-learning", "research"]
classifiers = ["Development Status :: 3 - Alpha", "Intended Audience :: Science/Research", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.11", "Topic :: Scientific/Engineering :: Artificial Intelligence"]
authors = [{name = "Researcher"}]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pyrefly>=1.3.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]
notebooks = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "jupytext>=1.19.6",
    "nbconvert>=7.17.1",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    {index = "pytorch-cpu", marker = "sys_platform == 'linux'"},
]
torchvision = [
    {index = "pytorch-cpu", marker = "sys_platform == 'linux'"},
]
torchaudio = [
    {index = "pytorch-cpu", marker = "sys_platform == 'linux'"},
]

[tool.hatch.build.targets.wheel]
packages = ["src/memory_machines"]

[tool.ruff]
line-length = 200
target-version = "py311"
src = ["src"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --doctest-modules"
doctest_optionflags = "NORMALIZE_WHITESPACE ELLIPSIS"
